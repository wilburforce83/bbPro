        <div class="ui mini equal width center aligned form">

                        <label>Fast Period </label>

        <div class="ui small green submit button" id="saveChanges">Save Changes</div>

<script>
    const dialog = require('electron').remote.dialog;



    const electron = require('electron')
    const path = require('path')
    const remote = electron.remote
    const {
        app,
        BrowserWindow,
        Menu
    } = require('electron')
    const shell = require('electron').shell
    const settings = require('electron').remote.require('electron-settings');
    const ws = require('ws');

    const closeBtn = document.getElementById('closeBtn');
    const saveChanges = document.getElementById('saveChanges');
    const resetDefaults = document.getElementById('resetDefaults');

    var LiveApi = require('binary-live-api').LiveApi;
    var api = new LiveApi({
        websocket: ws,
        appId: 18970
    });


    // Jquery macd functions


    // endof Jquery macd functions



    function passSettings() {
        //Important placeholder fo setting details can be used for all settings!!

        if (settings.has('macdfastPeriod.macdfastPeriod')) {

            document.getElementById("macdfastPeriod").value = settings.get(
                'macdfastPeriod.macdfastPeriod')

        }
        if (settings.has('macdslowPeriod.macdslowPeriod')) {

            document.getElementById("macdslowPeriod").value = settings.get(
                'macdslowPeriod.macdslowPeriod')

        }
        if (settings.has('macdsignalPeriod.macdsignalPeriod')) {

            document.getElementById("macdsignalPeriod").value = settings.get(
                'macdsignalPeriod.macdsignalPeriod')

        }
        /*
        if (settings.has('macdVariable4.macdVariable4')) {

            document.getElementById("macdVariable4").value = settings.get(
                'macdVariable4.macdVariable4')

        }
        */



        // end of collect settings












        //Save new settings

        saveChanges.addEventListener('click', function (event) {

            //add new event settings within this function

            let macdfastPeriodCollect = document.getElementById('macdfastPeriod').value;


            settings.set('macdfastPeriod', {

                macdfastPeriod: macdfastPeriodCollect



            })
            let macdslowPeriodCollect = document.getElementById('macdslowPeriod').value;


            settings.set('macdslowPeriod', {

                macdslowPeriod: macdslowPeriodCollect



            })
            let macdsignalPeriodCollect = document.getElementById('macdsignalPeriod').value;


            settings.set('macdsignalPeriod', {

                macdsignalPeriod: macdsignalPeriodCollect



            })
            /*
            let macdVariable4Collect = document.getElementById('macdVariable4').value;


            settings.set('macdVariable4', {

                macdVariable4: macdVariable4Collect



            })
            */


            settings.set('message.message', 'Your MACD Triggers have been saved. Build a strategy to use.')
            var windows = remote.getCurrentWindow();
            window.close()
        });




        resetDefaults.addEventListener('click', function (event) {


            //macd defaults

            settings.set('macdfastPeriod.macdfastPeriod', 5); // first variable
            settings.set('macdslowPeriod.macdslowPeriod', 8); // second variable
            settings.set('macdsignalPeriod.macdsignalPeriod', 3); // thirdvariable
            // settings.set('macdVariable4.macdVariable4', 0); // fourth variable
            // end of macd defaults

            settings.set('message.message', 'macd triggers restored to default settings.')
            passSettings()

        });













        closeBtn.addEventListener('click', function (event) {

            var windows = remote.getCurrentWindow();
            window.close()
        })
    }
</script>
