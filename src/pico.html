<script>
    var reload = () => {
        getCurrentWindow().reload()
    }

    globalShortcut.register('F5', reload);
    globalShortcut.register('CommandOrControl+R', reload);
    // here is the fix bug #3778, if you know alternative ways, please write them
    window.addEventListener('beforeunload', () => {
        globalShortcut.unregister('F5', reload);
        globalShortcut.unregister('CommandOrControl+R', reload);
    })



    // Keep trading dash upto date

    function updateDash() {

       

        document.getElementById('stake').textContent = settings.get('stake.stake');
        document.getElementById('profit').textContent = settings.get('profit.profit');
        document.getElementById('winRate').textContent = settings.get('winRate.winRate');

        // set up styling for different values       
        if (settings.get('profit.profit') >= 0) {
            document.getElementById('profit').style.color = '#21ba45';
        } else {
            document.getElementById('profit').style.color = 'red';

        }

        // set up tri-color state for win rate
        if (settings.get('winRate.winRate') >= 45 && settings.get('winRate.winRate') < 52) {
            document.getElementById('winRate').style.color = '#fbbd08';
        } else if (settings.get('winRate.winRate') >= 52) {
            document.getElementById('winRate').style.color = '#21ba45';

        } else {
            document.getElementById('winRate').style.color = 'red';

        }

    }
    updateDash()
    setInterval(updateDash, 1000);

    // sidebar set paramter logic


    // ErrorCatching and printto notification windows -- rename and

    window.onerror = function myErrorHandler(errorMsg, url, lineNumber) {
        alert("Binary.com error occured: " + errorMsg); //or any message
        return false;
    }


    document.getElementById('closeMe').addEventListener('click', function (event) {


        var windows = getCurrentWindow();
        window.close()
    });
</script>
