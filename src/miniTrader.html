<script>
    var reload = () => {
        getCurrentWindow().reload()
    }

    globalShortcut.register('F5', reload);
    globalShortcut.register('CommandOrControl+R', reload);
    // here is the fix bug #3778, if you know alternative ways, please write them
    window.addEventListener('beforeunload', () => {
        globalShortcut.unregister('F5', reload);
        globalShortcut.unregister('CommandOrControl+R', reload);
    })


    // listen for system reset, and set all trading back to 0

    document.getElementById('resetBot').addEventListener('click', function (event) {

        resetTradingOnClick()

    });

    //manage market selection

    $('#autosym').click(function () {

        settings.set('changesymAuto.changesymAuto', true);
        autoSelect()

    });
    $('#autosymFX').click(function () {

        settings.set('changesymAuto.changesymAuto', true);
        autoSelect()

    });

    $('#10sym').click(function () {

        settings.set('symbol.symbol', 'R_10');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#25sym').click(function () {

        settings.set('symbol.symbol', 'R_25');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#50sym').click(function () {

        settings.set('symbol.symbol', 'R_50');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#75sym').click(function () {

        settings.set('symbol.symbol', 'R_75');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#100sym').click(function () {

        settings.set('symbol.symbol', 'R_100');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#bullsym').click(function () {

        settings.set('symbol.symbol', 'RDBULL');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#bearsym').click(function () {

        settings.set('symbol.symbol', 'RDBEAR');
        settings.set('changesymAuto.changesymAuto', false);
    });

    // FOREX 


    $('#usdchf').click(function () {

        settings.set('symbol.symbol', 'frxUSDCHF');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#eurusd').click(function () {

        settings.set('symbol.symbol', 'frxEURUSD');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#usdjpy').click(function () {

        settings.set('symbol.symbol', 'frxUSDJPY');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#gbpusd').click(function () {

        settings.set('symbol.symbol', 'frxGBPUSD');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#audusd').click(function () {

        settings.set('symbol.symbol', 'frxAUDUSD');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#nzdusd').click(function () {

        settings.set('symbol.symbol', 'frxNZDUSD');
        settings.set('changesymAuto.changesymAuto', false);
    });
    $('#usdcad').click(function () {

        settings.set('symbol.symbol', 'frxUSDCAD');
        settings.set('changesymAuto.changesymAuto', false);
    });

    $('#setVirt').click(function () {


    });

    $('#setLive').click(function () {

    });

    $('#setFX').click(function () {
        settings.set('forex.forex', true);

    });
    $('#setVIX').click(function () {

        settings.set('forex.forex', false);
    });



    // set settings conditions for trading from buttons


    document.getElementById('startBot').addEventListener('click', function (event) {

        startBot()
        authorise();

    });

    document.getElementById('pauseBot').addEventListener('click', function (event) {

        pauseBot()
        authorise();


    });


    document.getElementById('setVirt').addEventListener('click', function (event) {

        settings.set('tokenToBeUsed.tokenToBeUsed', settings.get('virtualToken.virtualToken'));


        authorise();
    })



    document.getElementById('setLive').addEventListener('click', function (event) {

        settings.set('tokenToBeUsed.tokenToBeUsed', settings.get('liveToken.liveToken'));

        authorise();
    })





    // Manual trading buttons event listeners with conditions for when auto trading is on REMOVE comment on tradeinprogress true, once placetrades has been written

    document.getElementById('callTrade').addEventListener('click', function (event) {


        manualCall()
    });



    document.getElementById('putTrade').addEventListener('click', function (event) {


        manualPut()
    });



    // Keep trading dash upto date

    function updateDash() {

        setMarketBtn()
        symbolBtns()
        setAccountBtn()

        document.getElementById('stake').textContent = settings.get('stake.stake');
        document.getElementById('profit').textContent = settings.get('profit.profit');
        document.getElementById('winRate').textContent = settings.get('winRate.winRate');

        // set up styling for different values       
        if (settings.get('profit.profit') >= 0) {
            document.getElementById('profit').style.color = '#21ba45';
        } else {
            document.getElementById('profit').style.color = 'red';

        }

        // set up tri-color state for win rate
        if (settings.get('winRate.winRate') >= 45 && settings.get('winRate.winRate') < 52) {
            document.getElementById('winRate').style.color = '#fbbd08';
        } else if (settings.get('winRate.winRate') >= 52) {
            document.getElementById('winRate').style.color = '#21ba45';

        } else {
            document.getElementById('winRate').style.color = 'red';

        }

        // set upauto limits if set
        if (settings.get('autothresh.autothresh') > 0) {


            settings.set('autolimit.autolimit', true);

        }

        //messages
        document.getElementById('notifyme').textContent = settings.get('message.message');


        //Stats etc







        // control button functions while trading!

        if (settings.get('tradeInProgress.tradeInProgress', true) || (settings.get('autoTrade.autoTrade', true) &&
                settings.get('run.run', true))) {

            document.getElementById("callTrade").disabled = true;
            document.getElementById("putTrade").disabled = true;

        } else {

            document.getElementById("callTrade").disabled = false;
            document.getElementById("putTrade").disabled = false;

        }

        if (settings.get('run.run', true)) {

            document.getElementById("startBot").disabled = true;
        } else {

            document.getElementById("startBot").disabled = false;
        }

        if (settings.get('liveToken.liveToken') === settings.get('tokenToBeUsed.tokenToBeUsed')) {

            $('#setLive').addClass('disabled');
            $('#setLive').addClass('green');
            $('#setVirt').removeClass('disabled');
            $('#setVirt').removeClass('green');

        } else {

            $('#setVirt').addClass('disabled');
            $('#setVirt').addClass('green');
            $('#setLive').removeClass('disabled');
            $('#setLive').removeClass('green');

        }
        if (settings.get('changesymAuto.changesymAuto')) {

            $('#autosym').addClass('disabled');
            $('#autosym').addClass('orange');
            $('#10sym, #25sym, #50sym, #75sym, #100sym, #bullsym, #bearsym').removeClass('disabled');
            $('#10sym, #25sym, #50sym, #75sym, #100sym, #bullsym, #bearsym').removeClass('green');

        }

        if (settings.get('changesymAuto.changesymAuto') === false) {

            $('#autosym').removeClass('orange');
        }

        if (settings.get('symbol.symbol') === 'R_10') {
            $('#10sym').addClass('disabled');
            $('#10sym').addClass('green');
            $('#autosym, #25sym, #50sym, #75sym, #100sym, #bullsym, #bearsym').removeClass('disabled');
            $('#autosym, #25sym, #50sym, #75sym, #100sym, #bullsym, #bearsym').removeClass('green');

        }
        if (settings.get('symbol.symbol') === 'R_25') {
            $('#25sym').addClass('disabled');
            $('#25sym').addClass('green');
            $('#10sym, #autosym, #50sym, #75sym, #100sym, #bullsym, #bearsym').removeClass('disabled');
            $('#10sym, #autosym, #50sym, #75sym, #100sym, #bullsym, #bearsym').removeClass('green');
        }

        if (settings.get('symbol.symbol') === 'R_50') {
            $('#50sym').addClass('disabled');
            $('#50sym').addClass('green');
            $('#10sym, #25sym, #autosym, #75sym, #100sym, #bullsym, #bearsym').removeClass('disabled');
            $('#10sym, #25sym, #autosym, #75sym, #100sym, #bullsym, #bearsym').removeClass('green');
        }
        if (settings.get('symbol.symbol') === 'R_75') {
            $('#75sym').addClass('disabled');
            $('#75sym').addClass('green');
            $('#10sym, #25sym, #50sym, #autosym, #100sym, #bullsym, #bearsym').removeClass('disabled');
            $('#10sym, #25sym, #50sym, #autosym, #100sym, #bullsym, #bearsym').removeClass('green');
        }
        if (settings.get('symbol.symbol') === 'R_100') {
            $('#100sym').addClass('disabled');
            $('#100sym').addClass('green');
            $('#10sym, #25sym, #50sym, #75sym, #autosym, #bullsym, #bearsym').removeClass('disabled');
            $('#10sym, #25sym, #50sym, #75sym, #autosym, #bullsym, #bearsym').removeClass('green');
        }
        if (settings.get('symbol.symbol') === 'RDBULL') {
            $('#bullsym').addClass('disabled');
            $('#bullsym').addClass('green');
            $('#10sym, #25sym, #50sym, #75sym, #100sym, #autosym, #bearsym').removeClass('disabled');
            $('#10sym, #25sym, #50sym, #75sym, #100sym, #autosym, #bearsym').removeClass('green');
        }
        if (settings.get('symbol.symbol') === 'RDBEAR') {
            $('#bearsym').addClass('disabled');
            $('#bearsym').addClass('green');
            $('#10sym, #25sym, #50sym, #75sym, #100sym, #bullsym, #autosym').removeClass('disabled');
            $('#10sym, #25sym, #50sym, #75sym, #100sym, #bullsym, #autosym').removeClass('green');
        }



    }


    updateDash()
    setInterval(updateDash, 1000);

    // sidebar set paramter logic


    // ErrorCatching and printto notification windows -- rename and
    //changein production to give awarngint o restartthe application after binary.com failure 

    window.onerror = function myErrorHandler(errorMsg, url, lineNumber) {
        alert("Binary.com error occured: " + errorMsg); //or any message
        return false;
    }


    document.getElementById('closeMe').addEventListener('click', function (event) {


        var windows = getCurrentWindow();
        window.close()
    });
</script>
