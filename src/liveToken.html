<html lang="en">

<head>
    <meta charset="UTF-8">

        body {
            height: 100%;
            overflow-y: hidden;

<body onload="passSettings()">

    <div class="ui padded inverted segment">
        <h5>Please enter your live API token Here</h5>
        <div class="ui inverted form">
            <div class="one field">
                <div class="field">
                    <label>Live API Token</label>
                    <input id="liveToken" placeholder="Paste Here" type="text">
                    <h6><span id="liveTestResult"></span></h6>
                </div>
            </div>

            <div class="ui small button" id="closeBtn">Cancel</div>
            <div class="ui small button" id="testBtn">Test</div>
            <div class="ui small green submit button" id="saveTokens">Save Tokens</div>
        </div>
    </div>



</body>


<script>
    const dialog = require('electron').remote.dialog;


    const electron = require('electron')
    const path = require('path')
    const remote = electron.remote
    const {
        app,
        BrowserWindow,
        Menu
    } = require('electron')
    const shell = require('electron').shell
    const settings = require('electron').remote.require('electron-settings');
    const ws = require('ws');

    const closeBtn = document.getElementById('closeBtn');
    const saveTokens = document.getElementById('saveTokens');
    const testBtn = document.getElementById('testBtn');

    var LiveApi = require('binary-live-api').LiveApi;
    var api = new LiveApi({
        websocket: ws,
        appId: 16261
    });


    //Important placeholder fo setting details can be used for all settings!!

    if (settings.has('liveToken.liveToken')) {

        document.getElementById("liveToken").value = settings.get('liveToken.liveToken')

    }



    saveTokens.addEventListener('click', function (event) {

        let liveTokenCollect = document.getElementById('liveToken').value;


        settings.set('liveToken', {

            liveToken: liveTokenCollect


        })
        console.log('live token: ', settings.get('liveToken.liveToken'));


        var windows = remote.getCurrentWindow();
        window.close()
    });



    // test token with authorise and and send alert

    testBtn.addEventListener('click', function (event) {

        let token = document.getElementById('liveToken').value;

        api.authorize(token).then(

            () => {
                document.getElementById('liveTestResult').textContent = "Token Authorized!";
                document.getElementById('liveTestResult').style.color = 'green'

            },
            () => {
                document.getElementById('liveTestResult').textContent = "Not Authorized, try again!"
                document.getElementById('liveTestResult').style.color = 'red'
            }

        );



    });













    closeBtn.addEventListener('click', function (event) {

        var windows = remote.getCurrentWindow();
        window.close()
    })
</script>



</html>
